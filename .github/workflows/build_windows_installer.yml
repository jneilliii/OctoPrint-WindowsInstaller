name: 👷 Build Installer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [octoprint_release]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: 👀 Get OctoPrint Version
      id: octoprint_version
      uses: jneilliii/github-action-get-latest-release@master
      with:
        repository: OctoPrint/OctoPrint
        excludes: draft
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 📌 Checkout
      uses: actions/checkout@v7

    - name: 🔨 Build Installer
      run: |
        "%programfiles(x86)%\Inno Setup 6\iscc.exe" /DOctoPrintVersion="${{ steps.octoprint_version.outputs.release }}" "OctoPrint Setup.iss"
      shell: cmd

    - name: ✅ Validate Signing Secrets
      shell: pwsh
      run: |
        $required = @(
          'CODESIGN_CA',
          'CODESIGN_BASE64',
          'CODESIGN_PWD',
          'CODESIGN_SHA1'
        )

        $missing = @()
        foreach ($secret in $required) {
          $value = [Environment]::GetEnvironmentVariable("GITHUB_SECRET_$secret")
          if ($null -eq $value -or [string]::IsNullOrWhiteSpace($value)) {
            $missing += $secret
          }
        }

        if ($missing.Count -gt 0) {
          Write-Host "Missing required GitHub Action secrets: $($missing -join ', ')"
          "CODESIGN_SECRETS_PRESENT=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          "CODESIGN_SECRETS_PRESENT=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

    - name: 🔨 Generate CA
      if: ${{ env.CODESIGN_SECRETS_PRESENT == 'true' }}
      id: write_file
      uses: timheuer/base64-to-file@v2.0
      with:
        fileName: 'OctoPrintCA.crt'
        encodedString: ${{ secrets.CODESIGN_CA }}

    - name: 💉 Import CA
      if: ${{ env.CODESIGN_SECRETS_PRESENT == 'true' }}
      run: |
        certutil -addstore "Root" "${{ steps.write_file.outputs.filePath }}"
      shell: cmd

    - name: ✏️ Sign Installer
      if: ${{ env.CODESIGN_SECRETS_PRESENT == 'true' }}
      uses: jneilliii/code-sign-action@master
      with:
        certificate: '${{ secrets.CODESIGN_BASE64 }}'
        password: '${{ secrets.CODESIGN_PWD }}'
        certificatesha1: '${{ secrets.CODESIGN_SHA1 }}'
        cert-description: 'OctoPrint Installer by jneilliii'
        folder: 'Output'
        recursive: false
        timestampUrl: 'http://timestamp.digicert.com'
        debug: true

    - name: ℹ️ Code signing skipped
      if: ${{ env.CODESIGN_SECRETS_PRESENT != 'true' }}
      shell: pwsh
      run: |
        Write-Host "Code signing was skipped because required GitHub secrets are missing."
        Write-Host "Set CODESIGN_CA, CODESIGN_BASE64, CODESIGN_PWD, and CODESIGN_SHA1 in the repository secrets to enable signing."

    - name: 🧹 Delete Existing Release and Tag
      run: gh release delete ${{ steps.octoprint_version.outputs.release }} --cleanup-tag
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🚀 Create Release and Attach Assets
      uses: softprops/action-gh-release@v3
      with:
        name: "OctoPrint ${{ steps.octoprint_version.outputs.release }} Setup for Windows"
        tag_name: "${{ steps.octoprint_version.outputs.release }}"
        body: "OctoPrint Setup created with Inno Setup using WinPython, winsw, and GitHub Actions."
        fail_on_unmatched_files: true
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: ${{ steps.octoprint_version.outputs.prerelease }}
        files: |
          Output/OctoPrint Setup ${{ steps.octoprin
